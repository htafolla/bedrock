<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Bedrock cornerstone">
  <!-- Dark ground -->
  <rect width="32" height="32" rx="6" fill="#120e0b"/>
  <!-- Cornerstone: the rejected stone set as foundation (L-form at lower-left = corner) -->
  <!-- Main face of the stone -->
  <path
    d="M7 11h12v14H7V11z"
    fill="#2a221c"
    stroke="#c4a574"
    stroke-width="1.25"
    stroke-linejoin="round"
  />
  <!-- Top bevel (light on stone) -->
  <path d="M7 11h12l-2.5 3.5H9.5L7 11z" fill="#3d3228" stroke="#c4a574" stroke-width="0.75" stroke-linejoin="round"/>
  <!-- Side return — the corner that joins the walls -->
  <path
    d="M19 11l5 3.5V25l-5-2.5V11z"
    fill="#1f1914"
    stroke="#c4a574"
    stroke-width="1.25"
    stroke-linejoin="round"
  />
  <!-- Ember of residual heat — chosen, not discarded -->
  <circle cx="13" cy="19.5" r="2.1" fill="#e8a050" opacity="0.9"/>
  <circle cx="13" cy="19.5" r="1" fill="#f5e6c8" opacity="0.55"/>
</svg>
