<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Avoid theme flash: apply local preference before first paint. Dark is default. */
      try {
        var t = localStorage.getItem('bedrock.theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>

    <title>Bedrock — Do Better. Be Better. Trust God.</title>
    <meta
      name="description"
      content="Bedrock is a Hitchhiker's field guide for the storm: biblical first principles, short under-fire hacks, and prayer for grief, regret, fear, spiritual warfare, and readiness. Max-cope. Grow. Trust God."
    />
    <meta
      name="keywords"
      content="Bedrock, Christian field guide, spiritual warfare, grief, regret, rumination, fear, Armor of God, fruit of the Spirit, watch and be ready, ten virgins, hope of glory, treasure in heaven, prayer, Bible, Do Better Be Better Trust God"
    />
    <meta name="author" content="Bedrock" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Bedrock" />
    <meta name="apple-mobile-web-app-title" content="Bedrock" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="ai-content-declaration"

    <meta name="subject" content="Christian spiritual formation, grief, spiritual warfare, readiness" />
